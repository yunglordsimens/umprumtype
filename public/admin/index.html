<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>UMPRUM Type — Admin</title>
  <link type="text/yaml" rel="cms-config-url" href="/admin/config.yml" />
  <!-- ── UMPRUM Type theme for Decap ─────────────────────────────────────
       Decap has no theme API: these override its components by the names
       it puts in class names (e.g. "…-PublishButton"). They're tied to the
       pinned Decap version below — re-check this block when upgrading. -->
  <style>
    @font-face { font-family: 'Svar'; src: url('/fonts/Svar/3_Svar%20Regular.woff2') format('woff2'); font-weight: 400 900; font-display: swap; }
    @font-face { font-family: 'Svar'; src: url('/fonts/Svar/2_Svar%20Light.woff2') format('woff2'); font-weight: 300; font-display: swap; }
    :root {
      --u-bg: #f8f8f8;
      --u-surface: #ffffff;
      --u-text: #111111;
      --u-muted: #666666;
      --u-subtle: #999999;
      --u-border: rgba(0,0,0,0.12);
      --u-border-strong: rgba(0,0,0,0.3);
      --u-font: 'Svar', 'Helvetica Neue', system-ui, sans-serif;
    }

    /* Type & base */
    body { background: var(--u-bg) !important; color: var(--u-text); }
    body *:not(code):not(pre):not(kbd):not(samp) { font-family: var(--u-font) !important; }
    body [class*="-StyledAuthenticationPage"],
    body [class*="-AppMainContainer"],
    body [class*="-CollectionContainer"] { background: var(--u-bg) !important; }

    /* Login */
    body [class*="-StyledAuthenticationPage"] img { width: 300px !important; height: auto !important; max-width: 80vw !important; }
    body [class*="-LoginButtonIcon"] { color: #fff !important; }
    body [class*="-LoginButtonIcon"] svg { fill: #fff !important; width: 20px !important; height: 20px !important; }
    body button[class*="-LoginButton"] {
      background: var(--u-text) !important; color: #fff !important;
      border-radius: 9999px !important; box-shadow: none !important;
      padding: 0 28px !important; font-size: 15px !important;
    }

    /* Header */
    body header[class*="-AppHeader"] { background: var(--u-surface) !important; box-shadow: none !important; border-bottom: 1px solid var(--u-border) !important; }
    body [class*="-AppHeaderLogo"] img { width: 112px !important; height: auto !important; max-height: none !important; padding: 0 20px 0 24px !important; box-sizing: content-box !important; }
    body [class*="-AppHeaderLink"] { color: var(--u-muted) !important; }
    body [class*="-AppHeaderLink"]:hover { color: var(--u-text) !important; }
    body [class*="-AppHeaderButton"],
    body [class*="-AppHeaderNavLink"] { color: var(--u-muted) !important; font-size: 15px !important; font-weight: 400 !important; }
    body [class*="-AppHeaderButton"]:hover,
    body .header-link-active,
    body .header-link-active * { color: var(--u-text) !important; }
    body [class*="-AppHeaderQuickNewButton"],
    body [class*="-AppHeaderQuickNewButton"]:hover { background: var(--u-text) !important; color: #fff !important; border-radius: 9999px !important; box-shadow: none !important; }

    /* Sidebar & collection lists */
    body [class*="-SidebarContainer"],
    body [class*="-CollectionTopContainer"],
    body [class*="-ListCard "], body [class$="-ListCard"],
    body [class*="-GridCard "], body [class$="-GridCard"] { box-shadow: none !important; border: 1px solid var(--u-border) !important; border-radius: 10px !important; }
    body [class*="-SidebarHeading"],
    body [class*="-CollectionTopHeading"] { font-weight: 400 !important; letter-spacing: -0.01em !important; }
    body [class*="-SidebarNavLink"] { color: var(--u-muted) !important; border-left-width: 0 !important; font-size: 15px !important; }
    body [class*="-SidebarNavLink"]:hover { color: var(--u-text) !important; background: rgba(0,0,0,0.03) !important; }
    body .sidebar-active { color: var(--u-text) !important; background: rgba(0,0,0,0.05) !important; }
    body .sidebar-active * { color: var(--u-text) !important; }
    body [class*="-CollectionTopNewButton"] { background: var(--u-text) !important; color: #fff !important; border-radius: 9999px !important; box-shadow: none !important; }
    body [class*="-ViewControlsButton"] { color: var(--u-subtle) !important; }
    body [class*="-ViewControlsButton"][class*="-buttonActive"],
    body [class*="-ViewControlsButton"]:hover { color: var(--u-text) !important; }
    body [class*="-ListCardTitle"],
    body [class*="-CardHeading"] { font-weight: 400 !important; }

    /* Editor top bar */
    body [class*="-ToolbarContainer"] { box-shadow: none !important; border-bottom: 1px solid var(--u-border) !important; }
    body [class*="-BackStatus"] { color: var(--u-subtle) !important; text-transform: none !important; font-weight: 400 !important; }
    body [class*="-BackStatus"][class*="textBadgeDanger"] { color: #b42318 !important; }
    body [class*="-PublishButton"],
    body [class*="-SaveButton"] { background: var(--u-text) !important; color: #fff !important; border-radius: 9999px !important; }
    body [class*="-DeleteButton"] { background: transparent !important; color: #b42318 !important; border: 1px solid currentColor !important; border-radius: 9999px !important; }
    body [class*="-EditorToggle"] { color: var(--u-text) !important; box-shadow: none !important; border: 1px solid var(--u-border) !important; }

    /* Fields */
    body [class*="-FieldLabel"] {
      background: transparent !important; color: var(--u-muted) !important;
      text-transform: none !important; letter-spacing: 0 !important;
      font-size: 14px !important; font-weight: 400 !important;
      border: 0 !important; padding: 0 0 6px !important; margin: 0 !important;
    }
    body [class*="-ControlContainer"]:focus-within > [class*="-FieldLabel"] { color: var(--u-text) !important; }
    /* Decap draws each field's box on the widget element right under the
       label (input, textarea, date/select wrapper, editor…) */
    body [class*="-ControlContainer"] > :not([class*="-ControlTopbar"]):not([class*="-ControlHint"]):not([class*="-ControlErrorsList"]) {
      border-width: 1px !important; border-color: var(--u-border) !important;
      border-radius: 8px !important; box-shadow: none !important;
    }
    body [class*="-ControlContainer"]:focus-within > :not([class*="-ControlTopbar"]):not([class*="-ControlHint"]):not([class*="-ControlErrorsList"]) {
      border-color: var(--u-text) !important;
    }
    body [class*="-ControlHint"] { color: var(--u-subtle) !important; font-size: 13px !important; line-height: 1.45 !important; margin-top: 6px !important; }
    body [class*="-ControlErrorsList"] li { color: #b42318 !important; }
    body [class*="-ToolbarToggleLabel"] { color: var(--u-subtle) !important; }
    body [class*="-ToolbarToggleLabel"][class*="Active"],
    body [class*="-ToolbarToggleLabel"]:hover { color: var(--u-text) !important; }
    /* Switches: grey when off, black when on (Decap keeps them blue either way) */
    body [class*="-ToggleBackground"] { background: var(--u-text) !important; }
    body [role="switch"][aria-checked="false"] > [class*="-ToggleBackground"] { background: #d4d4d4 !important; }
    body [class*="-FileWidgetButton"] {
      background: rgba(0,0,0,0.06) !important; border-radius: 9999px !important;
      padding: 4px 14px !important; font-size: 14px !important; font-weight: 400 !important;
    }
    body [class*="-FileWidgetButton"],
    body [class*="-AddButton"],
    body [class*="-ListItemTopBar"] button { color: var(--u-text) !important; }
    body [class*="-ObjectControl"],
    body [class*="-ListControl"],
    body [class*="-ListItemTopBar"],
    body [class*="-ToolbarContainer"][class*="Editor"] { border-color: var(--u-border) !important; }
    body [class*="-Toolbar"] [class*="-ToolbarButton"] { color: var(--u-muted) !important; }
    body .Resizer,
    body .Resizer::before { background: var(--u-border) !important; border-color: var(--u-border) !important; }

    /* Media library */
    body [class*="-CardImageWrapper"] { border-radius: 8px !important; }
    body [class*="-MediaLibraryButton"],
    body [class*="-UploadButton"] { border-radius: 9999px !important; }
  </style>
  <style>
    .gw__drop {
      border: 1px dashed rgba(0,0,0,0.3);
      border-radius: 8px;
      padding: 20px 16px;
      text-align: center;
      cursor: pointer;
      color: #555;
      font-size: 13px;
      transition: border-color 0.15s, background 0.15s;
      user-select: none;
      outline: none;
    }
    .gw__drop:hover,
    .gw__drop:focus,
    .gw__drop--over { border-color: #111; background: #f2f2f2; }
    .gw__grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 6px;
      margin-top: 10px;
    }
    .gw__thumb {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 4px;
      overflow: hidden;
      cursor: grab;
      background: #f4f4f4;
    }
    .gw__thumb:active { cursor: grabbing; }
    .gw__thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      display: block;
    }
    .gw__remove {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 20px;
      height: 20px;
      background: rgba(0,0,0,0.55);
      color: #fff;
      border: none;
      border-radius: 50%;
      font-size: 15px;
      line-height: 20px;
      text-align: center;
      cursor: pointer;
      padding: 0;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .gw__thumb:hover .gw__remove { opacity: 1; }
    .gw__count { font-size: 11px; color: #777; margin: 6px 0 0; }
    .gw__error { font-size: 12px; color: #c0392b; margin: 6px 0 0; }
  </style>
</head>
<body>
  <!-- Pinned: the theme above targets this exact version -->
  <script src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js"></script>
  <script>
    try {
      var h = window.h;
      var createClass = window.createClass;

      if (typeof h !== 'function') throw new Error('window.h is not a function: ' + typeof h);
      if (typeof createClass !== 'function') throw new Error('window.createClass is not a function: ' + typeof createClass);

      function toArray(val) {
        if (!val) return [];
        if (typeof val.toJS === 'function') return val.toJS();
        if (Array.isArray(val)) return val.slice();
        return [];
      }

      function getToken() {
        try {
          var s = window.CMS.store.getState();
          var user = s.getIn ? s.getIn(['auth', 'currentUser']) : null;
          if (user) {
            var t = user.get ? user.get('token') : user.token;
            if (t) return t;
          }
        } catch (_) {}
        var keys = ['decap-cms-user', 'netlify-cms-user'];
        for (var i = 0; i < keys.length; i++) {
          try {
            var v = JSON.parse(localStorage.getItem(keys[i]));
            if (v && v.token) return v.token;
          } catch (_) {}
        }
        return null;
      }

      function getCollection() {
        var m = window.location.hash.match(/#\/collections\/([^/]+)/);
        return m ? m[1] : 'gallery';
      }

      function compressImage(file) {
        var isPng = file.type === 'image/png';
        return new Promise(function (resolve, reject) {
          var MAX = 2400;
          var img = new Image();
          var url = URL.createObjectURL(file);
          img.onload = function () {
            URL.revokeObjectURL(url);
            var w = img.naturalWidth;
            var hh = img.naturalHeight;
            if (w > MAX) { hh = Math.round(hh * MAX / w); w = MAX; }
            var canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = hh;
            canvas.getContext('2d').drawImage(img, 0, 0, w, hh);
            canvas.toBlob(
              function (blob) {
                var reader = new FileReader();
                reader.onload = function () {
                  resolve({ b64: reader.result.split(',')[1], isPng: isPng });
                };
                reader.onerror = reject;
                reader.readAsDataURL(blob);
              },
              isPng ? 'image/png' : 'image/jpeg',
              isPng ? undefined : 0.82
            );
          };
          img.onerror = reject;
          img.src = url;
        });
      }

      function delay(ms) {
        return new Promise(function (resolve) { setTimeout(resolve, ms); });
      }

      function uploadFile(b64, filename, collection, token, attempt) {
        attempt = attempt || 0;
        var filePath = 'public/uploads/' + collection + '/' + filename;
        var apiUrl = 'https://api.github.com/repos/yunglordsimens/umprumtype/contents/' + filePath;
        var headers = {
          'Authorization': 'Bearer ' + token,
          'Content-Type': 'application/json',
        };
        return fetch(apiUrl, { headers: headers })
          .then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; })
          .then(function (existing) {
            var body = { message: 'upload ' + filename, content: b64, branch: 'main' };
            if (existing && existing.sha) body.sha = existing.sha;
            return fetch(apiUrl, { method: 'PUT', headers: headers, body: JSON.stringify(body) });
          })
          .then(function (res) {
            if (res.status === 409 && attempt < 4) {
              return delay(800 * (attempt + 1)).then(function () {
                return uploadFile(b64, filename, collection, token, attempt + 1);
              });
            }
            if (!res.ok) throw new Error('GitHub API error ' + res.status);
            return '/uploads/' + collection + '/' + filename;
          });
      }

      var GalleryControl = createClass({
        displayName: 'GalleryControl',

        getInitialState: function () {
          return {
            images: toArray(this.props.value),
            busy: false,
            progress: '',
            error: null,
            dragOver: false,
          };
        },

        componentDidUpdate: function (prevProps, prevState) {
          if (prevState.images !== this.state.images) {
            this.props.onChange(this.state.images);
          }
        },

        processFiles: function (files) {
          var self = this;
          var imgs = [];
          for (var i = 0; i < files.length; i++) {
            if (files[i].type && files[i].type.indexOf('image/') === 0) imgs.push(files[i]);
          }
          if (!imgs.length) return;
          var token = getToken();
          if (!token) { self.setState({ error: 'Not authenticated.' }); return; }
          var collection = getCollection();
          self.setState({ busy: true, error: null });
          var results = [];
          var chain = Promise.resolve();
          imgs.forEach(function (file, i) {
            chain = chain.then(function () {
              self.setState({ progress: (i + 1) + ' / ' + imgs.length });
              var pause = i === 0 ? Promise.resolve() : delay(600);
              return pause.then(function () { return compressImage(file); })
                .then(function (compressed) {
                  var ext = compressed.isPng ? 'png' : 'jpg';
                  var name = Date.now() + '-' + Math.random().toString(36).slice(2, 7) + '.' + ext;
                  return uploadFile(compressed.b64, name, collection, token);
                })
                .then(function (path) { results.push(path); })
                .catch(function (e) { self.setState({ error: e.message }); });
            });
          });
          chain.then(function () {
            self.setState(function (s) {
              return { images: s.images.concat(results), busy: false, progress: '' };
            });
          });
        },

        onDrop: function (e) {
          e.preventDefault();
          this.setState({ dragOver: false });
          this.processFiles(e.dataTransfer.files);
        },
        onDragOver: function (e) { e.preventDefault(); this.setState({ dragOver: true }); },
        onDragLeave: function () { this.setState({ dragOver: false }); },
        onFileChange: function (e) { this.processFiles(e.target.files); e.target.value = ''; },

        removeImage: function (idx) {
          this.setState(function (s) {
            return { images: s.images.filter(function (_, i) { return i !== idx; }) };
          });
        },

        onThumbDragStart: function (e, idx) {
          this._dragIdx = idx;
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', String(idx));
        },
        onThumbDragEnter: function (e, idx) {
          e.preventDefault();
          var from = this._dragIdx;
          if (from == null || from === idx) return;
          this.setState(function (s) {
            var arr = s.images.slice();
            var moved = arr.splice(from, 1)[0];
            arr.splice(idx, 0, moved);
            return { images: arr };
          });
          this._dragIdx = idx;
        },
        onThumbDragOver: function (e) { e.preventDefault(); },
        onThumbDragEnd: function () { this._dragIdx = null; },

        render: function () {
          var self = this;
          var s = this.state;
          var children = [];

          children.push(h('div', {
            key: 'drop',
            className: 'gw__drop' + (s.dragOver ? ' gw__drop--over' : ''),
            onDrop: function (e) { self.onDrop(e); },
            onDragOver: function (e) { self.onDragOver(e); },
            onDragLeave: function () { self.onDragLeave(); },
            onClick: function () { if (!s.busy && self._fileInput) self._fileInput.click(); },
            role: 'button',
            tabIndex: 0,
            onKeyDown: function (e) { if (e.key === 'Enter' && self._fileInput) self._fileInput.click(); },
          },
            h('input', {
              ref: function (el) { self._fileInput = el; },
              type: 'file',
              multiple: true,
              accept: 'image/*',
              style: { display: 'none' },
              onChange: function (e) { self.onFileChange(e); },
            }),
            s.busy ? ('Uploading ' + s.progress + '...') : '+ Add photos (click or drop multiple)'
          ));

          if (s.error) {
            children.push(h('p', { key: 'err', className: 'gw__error' }, s.error));
          }

          if (s.images.length > 0) {
            children.push(h('p', { key: 'count', className: 'gw__count' },
              s.images.length + ' photo' + (s.images.length !== 1 ? 's' : '') + ' - drag to reorder'
            ));
            children.push(h('div', { key: 'grid', className: 'gw__grid' },
              s.images.map(function (src, idx) {
                return h('div', {
                  key: String(idx),
                  className: 'gw__thumb',
                  draggable: true,
                  onDragStart: function (e) { self.onThumbDragStart(e, idx); },
                  onDragEnter: function (e) { self.onThumbDragEnter(e, idx); },
                  onDragOver: function (e) { self.onThumbDragOver(e); },
                  onDragEnd: function () { self.onThumbDragEnd(); },
                },
                  h('img', { src: src, alt: '' }),
                  h('button', {
                    type: 'button',
                    className: 'gw__remove',
                    onClick: function (e) { e.stopPropagation(); self.removeImage(idx); },
                  }, 'x')
                );
              })
            ));
          }

          return h('div', null, children);
        },
      });

      var GalleryPreview = createClass({
        displayName: 'GalleryPreview',
        render: function () {
          var imgs = toArray(this.props.value);
          if (!imgs.length) return null;
          return h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: '6px' } },
            imgs.map(function (src, i) {
              return h('img', {
                key: String(i), src: src, alt: '',
                style: { height: '72px', width: 'auto', borderRadius: '3px', objectFit: 'cover' },
              });
            })
          );
        },
      });

      window.CMS.registerWidget('gallery-upload', GalleryControl, GalleryPreview);
      // Preview pane uses the site's font and colours
      window.CMS.registerPreviewStyle('/admin/preview.css');

    } catch (err) {
      console.error('[gw] registration failed:', err.message, err.stack);
    }
  </script>
</body>
</html>
