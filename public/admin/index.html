<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>UMPRUM Type — Admin</title>
  <link type="text/yaml" rel="cms-config-url" href="/admin/config.yml" />
  <!-- ── UMPRUM Type theme for Decap ─────────────────────────────────────
       Decap has no theme API: these override its components by the names
       it puts in class names (e.g. "…-PublishButton"). They're tied to the
       pinned Decap version below — re-check this block when upgrading. -->
  <style>
    @font-face { font-family: 'Svar'; src: url('/fonts/Svar/3_Svar%20Regular.woff2') format('woff2'); font-weight: 400 900; font-display: swap; }
    @font-face { font-family: 'Svar'; src: url('/fonts/Svar/2_Svar%20Light.woff2') format('woff2'); font-weight: 300; font-display: swap; }
    /* Same language as the site: navigation is plain text (active = underlined),
       buttons are pills — solid black for the main action, hairline for the rest.
       Fields and cards are softly rounded, hairline, no shadows. */
    :root {
      --u-bg: #f8f8f8;
      --u-text: #111111;
      --u-muted: #666666;
      --u-subtle: #999999;
      --u-border: rgba(0,0,0,0.1);
      --u-border-strong: rgba(0,0,0,0.25);
      --u-danger: #b42318;
      --u-font: 'Svar', 'Helvetica Neue', system-ui, sans-serif;
    }

    /* ── Base ── */
    body { background: var(--u-bg) !important; color: var(--u-text); }
    body *:not(code):not(pre):not(kbd):not(samp) { font-family: var(--u-font) !important; }
    body * { box-shadow: none !important; }
    body [class*="-StyledAuthenticationPage"],
    body [class*="-AppMainContainer"],
    body [class*="-CollectionContainer"],
    body [class*="-EditorContainer"],
    body [class*="-ControlPaneContainer"],
    body [class*="-PreviewPaneContainer"] { background: var(--u-bg) !important; }
    body a { text-underline-offset: 0.28em; text-decoration-thickness: 1px; }

    /* Shared: navigation = plain text (underline when active/hovered) */
    body [class*="-AppHeaderButton"], body [class*="-AppHeaderNavLink"], body [class*="-AppHeaderLink"],
    body [class*="-AppHeaderSiteLink"], body [class*="-SidebarNavLink"], body [class*="-ViewControlsButton"],
    body [class*="-PreviewLink"] {
      background: transparent !important; border: 0 !important; border-radius: 0 !important;
      color: var(--u-muted) !important; font-weight: 400 !important; text-transform: none !important;
      text-decoration: none; text-underline-offset: 0.28em; text-decoration-thickness: 1px;
    }
    body [class*="-AppHeaderButton"]:hover, body [class*="-AppHeaderNavLink"]:hover, body [class*="-AppHeaderLink"]:hover,
    body [class*="-AppHeaderSiteLink"]:hover, body [class*="-SidebarNavLink"]:hover, body [class*="-ViewControlsButton"]:hover,
    body [class*="-PreviewLink"]:hover,
    body .header-link-active, body .header-link-active *,
    body .sidebar-active, body .sidebar-active *,
    body [class*="-ViewControlsButton"][class*="-buttonActive"] {
      color: var(--u-text) !important; background: transparent !important; text-decoration: underline;
    }

    /* Shared: secondary buttons = hairline pills */
    body [class*="-PublishedToolbarButton"], body [class*="-PublishedButton"], body [class*="-StatusButton"],
    body [class*="-DeleteButton"], body [class*="-FileWidgetButton"], body [class*="-AddButton"],
    body [class*="-DateTimeControl"] button, body [class*="-MediaLibraryButton"], body [class*="-UploadButton"] {
      background: transparent !important; border: 1px solid var(--u-border-strong) !important; border-radius: 9999px !important;
      padding-left: 14px !important; padding-right: 14px !important;
      color: var(--u-text) !important; font-weight: 400 !important; text-transform: none !important; text-decoration: none !important;
    }
    body [class*="-PublishedToolbarButton"]:hover, body [class*="-PublishedButton"]:hover, body [class*="-StatusButton"]:hover,
    body [class*="-FileWidgetButton"]:hover, body [class*="-AddButton"]:hover, body [class*="-DateTimeControl"] button:hover,
    body [class*="-MediaLibraryButton"]:hover, body [class*="-UploadButton"]:hover { border-color: var(--u-text) !important; }
    body [class*="-DeleteButton"] { color: var(--u-danger) !important; border-color: rgba(180,35,24,0.35) !important; }
    body [class*="-DeleteButton"]:hover { border-color: var(--u-danger) !important; }

    /* Shared: the one solid action */
    body button[class*="-LoginButton"],
    body [class*="-PublishButton"], body [class*="-SaveButton"],
    body [class*="-CollectionTopNewButton"], body [class*="-AppHeaderQuickNewButton"] {
      background: var(--u-text) !important; color: #fff !important; border: 0 !important; border-radius: 9999px !important;
      font-weight: 400 !important; text-transform: none !important;
    }
    body button[class*="-LoginButton"]:hover,
    body [class*="-PublishButton"]:hover, body [class*="-SaveButton"]:hover,
    body [class*="-CollectionTopNewButton"]:hover, body [class*="-AppHeaderQuickNewButton"]:hover { background: #333 !important; }
    body [class*="-PublishButton"][disabled], body [class*="-SaveButton"][disabled] { background: #c8c8c8 !important; }

    /* ── Login ── */
    body [class*="-CustomIconWrapper"] { width: auto !important; height: auto !important; display: flex !important; justify-content: center !important; }
    body [class*="-StyledAuthenticationPage"] img { width: 432px !important; height: auto !important; max-width: 90vw !important; }
    body [class*="-LoginButtonIcon"], body [class*="-LoginButtonIcon"] svg { color: #fff !important; fill: #fff !important; }
    body button[class*="-LoginButton"] { padding: 0 28px !important; height: 40px !important; }

    /* ── Header ── */
    body header[class*="-AppHeader"] { background: var(--u-bg) !important; border-bottom: 1px solid var(--u-border) !important; }
    body [class*="-AppHeaderLogo"] { display: flex !important; align-items: center !important; align-self: stretch; }
    body [class*="-AppHeaderContent"] { align-items: center !important; }
    body [class*="-AppHeaderContent"] > nav, body [class*="-AppHeaderNavList"] { display: flex !important; align-items: center !important; align-self: center !important; }
    body [class*="-AppHeaderLogo"] img { width: 161px !important; height: auto !important; max-height: none !important; padding: 0 20px 0 24px !important; box-sizing: content-box !important; }
    body [class*="-AppHeaderNavList"] [class*="-IconWrapper"] { display: none !important; }
    body [class*="-AppHeaderLink"], body [class*="-AppHeaderNavLink"] { margin-left: 24px !important; }
    body [class*="-AppHeaderQuickNewButton"] { margin-right: 8px !important; }
    body [class*="-PreviewLink"] * { color: inherit !important; fill: currentColor !important; }
    body [class*="-FieldLabel"] { position: static !important; }
    /* No global Media tab — photos are uploaded inside each entry */
    body [class*="-AppHeaderNavList"] button[class*="-AppHeaderButton"] { display: none !important; }

    /* ── Sidebar & collection lists: a column of text, hairline rows ── */
    body [class*="-SidebarContainer"],
    body [class*="-CollectionTopContainer"] { background: transparent !important; border: 0 !important; }
    body [class*="-SidebarHeading"],
    body [class*="-CollectionTopHeading"] { font-weight: 400 !important; letter-spacing: -0.01em !important; }
    body [class*="-SidebarNavLink"] { border-left-width: 0 !important; padding-left: 20px !important; }
    body [class*="-SidebarNavLink"] [class*="-IconWrapper"],
    body [class*="-CollectionTopHeading"] [class*="-IconWrapper"] { display: none !important; }
    body [class*="-CollectionTopDescription"] { color: var(--u-muted) !important; max-width: 60ch; }
    body [class*="-SearchContainer"] { background: transparent !important; border: 0 !important; border-bottom: 1px solid var(--u-border) !important; margin-left: 20px !important; margin-right: 20px !important; }
    body [class*="-SearchContainer"]:focus-within { border-bottom-color: var(--u-text) !important; }
    body [class*="-SearchInput"] { background: transparent !important; padding-left: 26px !important; }
    body [class*="-SearchContainer"] [class*="-IconWrapper"] { top: 50% !important; transform: translateY(-50%) !important; left: 0 !important; color: var(--u-subtle) !important; }

    body [class*="-ListCard "], body [class*="-ListCard-"], body [class$="-ListCard"] {
      background: transparent !important; border: 0 !important; border-bottom: 1px solid var(--u-border) !important; margin: 0 !important;
    }
    body [class*="-ListCard "]:hover, body [class*="-ListCard-"]:hover, body [class$="-ListCard"]:hover { background: rgba(0,0,0,0.02) !important; }
    body [class*="-GridCard "], body [class*="-GridCard-"], body [class$="-GridCard"] { background: transparent !important; border: 1px solid var(--u-border) !important; border-radius: 10px !important; overflow: hidden; }
    body [class*="-GridCard "]:hover, body [class*="-GridCard-"]:hover, body [class$="-GridCard"]:hover { border-color: var(--u-border-strong) !important; }
    body [class*="-ListCardTitle"], body [class*="-CardHeading"] { font-weight: 400 !important; color: var(--u-text) !important; }

    /* ── Editor top bar ── */
    body [class*="-ToolbarContainer"] { background: var(--u-bg) !important; border-bottom: 1px solid var(--u-border) !important; }
    body [class*="-ToolbarSectionBackLink"], body [class*="-ToolbarSectionMeta"] { border-color: var(--u-border) !important; }
    body [class*="-BackStatus"] { color: var(--u-subtle) !important; text-transform: none !important; font-weight: 400 !important; }
    body [class*="-BackStatus"][class*="textBadgeDanger"] { color: var(--u-danger) !important; }
    body [class*="-BackCollection"] { font-weight: 400 !important; }
    body [class*="-EditorToggle"] { background: transparent !important; color: var(--u-muted) !important; border: 1px solid var(--u-border) !important; border-radius: 50% !important; }
    body [class*="-EditorToggle"]:hover { color: var(--u-text) !important; border-color: var(--u-text) !important; }
    body a[class*="-ToolbarSectionMeta"], body [class*="-ToolbarSectionMeta"] a { color: var(--u-muted) !important; }

    /* ── Fields: hairline boxes, transparent, black on focus ── */
    body [class*="-FieldLabel"] {
      background: transparent !important; color: var(--u-muted) !important;
      text-transform: none !important; letter-spacing: 0 !important; font-weight: 400 !important;
      border: 0 !important; padding: 0 0 6px !important; margin: 0 !important;
    }
    body [class*="-ControlContainer"]:focus-within > [class*="-FieldLabel"] { color: var(--u-text) !important; }
    body [class*="-ControlContainer"] > :not([class*="-ControlTopbar"]):not([class*="-ControlHint"]):not([class*="-ControlErrorsList"]):not([class*="-FieldLabel"]) {
      border: 1px solid var(--u-border) !important; background: transparent !important; border-radius: 8px !important;
    }
    body [class*="-ControlContainer"] input,
    body [class*="-ControlContainer"] textarea,
    body [class*="-ControlContainer"] [class*="-control"] { background: transparent !important; }
    body [class*="-ControlContainer"]:focus-within > :not([class*="-ControlTopbar"]):not([class*="-ControlHint"]):not([class*="-ControlErrorsList"]):not([class*="-FieldLabel"]) {
      border-color: var(--u-text) !important;
    }
    body [class*="-ControlHint"] { color: var(--u-subtle) !important; line-height: 1.45 !important; margin-top: 6px !important; }
    body [class*="-ControlErrorsList"] li { color: var(--u-danger) !important; text-transform: none !important; font-weight: 400 !important; }
    body [class*="-ControlContainer"] [class*="-ToolbarContainer"] { background: transparent !important; border-bottom: 1px solid var(--u-border) !important; }
    body [class*="-ToolbarToggleLabel"] { color: var(--u-subtle) !important; }
    body [class*="-ToolbarToggleLabel"][class*="Active"], body [class*="-ToolbarToggleLabel"]:hover { color: var(--u-text) !important; }
    body [class*="-Toolbar"] [class*="-ToolbarButton"] { color: var(--u-muted) !important; }
    /* switches: square, grey off / black on */
    body [class*="-ToggleBackground"] { background: var(--u-text) !important; }
    body [role="switch"][aria-checked="false"] > [class*="-ToggleBackground"] { background: #d4d4d4 !important; }
    /* list widget (font files): hairline rows, "+ Add" as text */
    body [class*="-ObjectControl"], body [class*="-ListControl"], body [class*="-ListItemTopBar"] { border-color: var(--u-border) !important; background: transparent !important; }
    body [class*="-ListItemTopBar"] { border-bottom: 1px solid var(--u-border) !important; }
    body [class*="-ListItemTopBar"] button, body [class*="-AddButton"] { color: var(--u-text) !important; }
    body [class*="-AddButton"] [class*="-IconWrapper"] { margin-left: 0 !important; }
    body .Resizer { background: var(--u-border) !important; background-clip: padding-box !important; border-color: transparent !important; border-radius: 0 !important; }
    body .Resizer::before { display: none !important; }

    /* ── Sizes: 15px text, 13px secondary, 22px headings, 18px icons ── */
    body, body *:not(svg):not(path):not(code):not(pre) { font-size: 15px !important; }
    body [class*="-ControlHint"], body [class*="-BackStatus"], body [class*="-CollectionTopDescription"],
    body [class*="-ListCardDate"], body [class*="-CardDate"], body [class*="-ViewControlsText"],
    body [class*="-PaginationMessage"], body [class*="-ControlErrorsList"] li,
    body .gw__drop, body .gw__count, body .gw__error { font-size: 13px !important; }
    body [class*="-CollectionTopHeading"], body [class*="-SidebarHeading"] { font-size: 22px !important; line-height: 1.2 !important; }
    body [class*="-IconWrapper"]:not([class*="-NetlifyCreditIcon"]) { width: 18px !important; height: 18px !important; }
    body [class*="-IconWrapper"]:not([class*="-NetlifyCreditIcon"]) svg { width: 18px !important; height: 18px !important; }
    body [class*="-BackArrow"] { font-size: 18px !important; }
    body [class*="-EditorToggle"] { width: 36px !important; height: 36px !important; }
    body [class*="-PublishButton"], body [class*="-SaveButton"],
    body [class*="-CollectionTopNewButton"], body [class*="-AppHeaderQuickNewButton"] {
      height: 32px !important; line-height: 32px !important; min-height: 0 !important;
      padding: 0 16px !important; display: inline-flex !important; align-items: center !important; gap: 6px;
    }
    body [class*="-PublishedToolbarButton"], body [class*="-StatusButton"], body [class*="-DeleteButton"] {
      height: 32px !important; line-height: 32px !important; min-height: 0 !important; display: inline-flex !important; align-items: center !important;
    }
    body [class*="-PublishButton"]::after, body [class*="-PublishedToolbarButton"]::after,
    body [class*="-AppHeaderQuickNewButton"]::after { position: static !important; margin-left: 8px !important; }
    body [class*="-AvatarDropdownButton"] {
      width: 14px !important; height: 14px !important; min-width: 0 !important; padding: 0 !important;
      border-radius: 50% !important; background: var(--u-text) !important; border: 0 !important; margin: 0 24px 0 16px !important;
      transition: transform 150ms;
    }
    body [class*="-AvatarDropdownButton"]:hover { transform: scale(1.25); }
    body [class*="-AvatarDropdownButton"] > * { display: none !important; }

    /* ── Menus, toasts, media ── */
    body [class*="-DropdownList"] { border: 1px solid var(--u-border) !important; background: #fff !important; border-radius: 10px !important; padding: 6px 0 !important; box-shadow: 0 8px 24px rgba(0,0,0,0.08) !important; }
    body [class*="-StyledMenuItem"] { padding: 8px 16px !important; }
    body [class*="-StyledMenuItem"], body [class*="-MenuItemIconContainer"],
    body [class*="-MenuItemIconContainer"] [class*="-IconWrapper"] { color: var(--u-text) !important; background: transparent !important; }
    body [class*="-StyledMenuItem"]:hover { text-decoration: underline; }
    body .Toastify__toast { border-radius: 10px !important; }
    body .Toastify__toast--success, body .Toastify__toast--info, body .Toastify__toast--default { background: var(--u-text) !important; color: #fff !important; }
    body .Toastify__toast--warning, body .Toastify__toast--error { background: var(--u-danger) !important; color: #fff !important; }
    body .Toastify__progress-bar { background: rgba(255,255,255,0.35) !important; }
    /* ── UMPRUM additions ── */
    body * { scrollbar-width: none !important; }
    body *::-webkit-scrollbar { width: 0 !important; height: 0 !important; display: none !important; }
    body [class*="-CollectionTopDescription"] { white-space: pre-line !important; line-height: 1.7 !important; }
    body [class*="-AppHeaderNavLink"] { display: none !important; }   /* "Contents" — the logo does that */
    /* required = black + small "required" pill; optional = grey */
    body [class*="-FieldLabel"].u-req { color: var(--u-text) !important; }
    body [class*="-FieldLabel"].u-req::after {
      content: 'required' !important; display: inline-block !important; position: static !important;
      width: auto !important; height: auto !important; min-width: 0 !important; transform: none !important; background: none !important;
      margin: 0 0 0 8px !important; padding: 0 7px !important;
      font-size: 11px !important; line-height: 17px !important; vertical-align: 1px;
      border: 1px solid currentColor !important; border-radius: 9999px !important; color: var(--u-text);
    }
    body [class*="-FieldLabel"].u-opt { color: var(--u-subtle) !important; }
    /* grid cards: specimen / first photo on top */
    .u-card-media { display: block; height: 150px; background: center / cover no-repeat rgba(0,0,0,0.03); border-bottom: 1px solid var(--u-border); }
    body .u-card-type { font-family: var(--card-font, var(--u-font)) !important; }
    .u-card-type { display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; padding: 14px 16px; overflow: hidden; color: var(--u-text); background: transparent; }
    body .u-card-type .u-card-aa { font-size: 64px !important; line-height: 0.9; font-family: inherit !important; }
    body .u-card-type .u-card-line { font-size: 15px !important; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: inherit !important; color: var(--u-muted); }
    /* ── Phone: one header row, one left edge (16px) for everything ── */
    @media (max-width: 799px) {
      body [class*="-AppHeaderContent"] { display: flex !important; flex-direction: row !important; flex-wrap: nowrap !important; align-items: center !important; justify-content: space-between !important; padding: 0 16px !important; height: 56px !important; }
      body [class*="-AppHeaderContent"] > nav { order: 0; flex: 1 1 auto; min-width: 0; height: auto !important; }
      body [class*="-AppHeaderNavList"] { height: auto !important; }
      body [class*="-AppHeaderLogo"] { margin: 0 !important; padding: 0 !important; }
      body [class*="-AppHeaderLogo"] img { width: 150px !important; padding: 0 !important; margin: 0 !important; }
      body [class*="-AppHeaderContent"] > nav, body [class*="-AppHeaderNavList"] { margin: 0 !important; padding: 0 !important; justify-content: flex-start !important; gap: 0 !important; }
      body [class*="-AppHeaderNavList"] > li:not([class*="-AppHeaderLogo"]) { display: none !important; }
      body [class*="-AppHeaderActions"] { order: 1; width: auto !important; display: flex !important; align-items: center !important; gap: 12px; flex: none; }
      body [class*="-AppHeaderSiteLink"], body [class*="-AppHeaderTestRepoIndicator"] { display: none !important; }
      body [class*="-AppHeaderQuickNewButton"] { height: 30px !important; line-height: 30px !important; padding: 0 12px !important; }
      body [class*="-AvatarDropdownButton"] { margin: 0 0 0 4px !important; }
      body [class*="-CollectionContainer"] { margin: 0 !important; }
      body [class*="-SidebarContainer"], body [class*="-CollectionMain"] { left: 0 !important; width: 100% !important; margin: 0 !important; }
      body [class*="-SidebarHeading"] { padding-left: 16px !important; padding-right: 16px !important; margin-left: 0 !important; }
      body [class*="-SearchContainer"] { margin-left: 16px !important; margin-right: 16px !important; }
      body [class*="-SidebarNavLink"] { padding-left: 16px !important; }
      body [class*="-CollectionTopContainer"] { padding: 18px 16px !important; }
      body [class*="-CollectionControls"] { padding: 0 16px !important; }
      body [class*="-ListCard "], body [class*="-ListCard-"], body [class$="-ListCard"] { margin-left: 0 !important; margin-right: 0 !important; width: 100% !important; }
      body [class*="-CardsGrid"] { margin-left: 0 !important; margin-right: 0 !important; width: 100% !important; padding: 0 !important; }
      body [class*="-ListCardLink"] { padding-left: 16px !important; padding-right: 16px !important; }
      body [class*="-GridCard "], body [class*="-GridCard-"], body [class$="-GridCard"] { margin-left: 16px !important; margin-right: 16px !important; width: calc(100% - 32px) !important; max-width: none !important; flex: 1 1 100% !important; }
    }
    .u-card-empty { display: flex; align-items: center; justify-content: center; color: var(--u-subtle); }

  </style>
  <style>
    .gw__drop {
      border: 1px dashed rgba(0,0,0,0.25);
      border-radius: 8px;
      padding: 20px 16px;
      text-align: center;
      cursor: pointer;
      color: #555;
      font-size: 13px;
      transition: border-color 0.15s, background 0.15s;
      user-select: none;
      outline: none;
    }
    .gw__drop:hover,
    .gw__drop:focus,
    .gw__drop--over { border-color: #111; background: transparent; color: #111; }
    .gw__grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 6px;
      margin-top: 10px;
    }
    .gw__thumb {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 4px;
      overflow: hidden;
      cursor: grab;
      background: #f4f4f4;
    }
    .gw__thumb:active { cursor: grabbing; }
    .gw__thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      display: block;
    }
    .gw__remove {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 20px;
      height: 20px;
      background: rgba(0,0,0,0.55);
      color: #fff;
      border: none;
      border-radius: 50%;
      font-size: 15px;
      line-height: 20px;
      text-align: center;
      cursor: pointer;
      padding: 0;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .gw__thumb:hover .gw__remove { opacity: 1; }
    .gw__count { font-size: 11px; color: #777; margin: 6px 0 0; }
    .gw__error { font-size: 12px; color: #c0392b; margin: 6px 0 0; }
  </style>
</head>
<body>
  <!-- Pinned: the theme above targets this exact version -->
  <script src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js"></script>
  <script>
    try {
      var h = window.h;
      var createClass = window.createClass;

      if (typeof h !== 'function') throw new Error('window.h is not a function: ' + typeof h);
      if (typeof createClass !== 'function') throw new Error('window.createClass is not a function: ' + typeof createClass);

      function toArray(val) {
        if (!val) return [];
        if (typeof val.toJS === 'function') return val.toJS();
        if (Array.isArray(val)) return val.slice();
        return [];
      }

      function getToken() {
        try {
          var s = window.CMS.store.getState();
          var user = s.getIn ? s.getIn(['auth', 'currentUser']) : null;
          if (user) {
            var t = user.get ? user.get('token') : user.token;
            if (t) return t;
          }
        } catch (_) {}
        var keys = ['decap-cms-user', 'netlify-cms-user'];
        for (var i = 0; i < keys.length; i++) {
          try {
            var v = JSON.parse(localStorage.getItem(keys[i]));
            if (v && v.token) return v.token;
          } catch (_) {}
        }
        return null;
      }

      function getCollection() {
        var m = window.location.hash.match(/#\/collections\/([^/]+)/);
        return m ? m[1] : 'gallery';
      }

      function compressImage(file) {
        var isPng = file.type === 'image/png';
        return new Promise(function (resolve, reject) {
          var MAX = 2400;
          var img = new Image();
          var url = URL.createObjectURL(file);
          img.onload = function () {
            URL.revokeObjectURL(url);
            var w = img.naturalWidth;
            var hh = img.naturalHeight;
            if (w > MAX) { hh = Math.round(hh * MAX / w); w = MAX; }
            var canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = hh;
            canvas.getContext('2d').drawImage(img, 0, 0, w, hh);
            canvas.toBlob(
              function (blob) {
                var reader = new FileReader();
                reader.onload = function () {
                  resolve({ b64: reader.result.split(',')[1], isPng: isPng });
                };
                reader.onerror = reject;
                reader.readAsDataURL(blob);
              },
              isPng ? 'image/png' : 'image/jpeg',
              isPng ? undefined : 0.82
            );
          };
          img.onerror = reject;
          img.src = url;
        });
      }

      function delay(ms) {
        return new Promise(function (resolve) { setTimeout(resolve, ms); });
      }

      function uploadFile(b64, filename, collection, token, attempt) {
        attempt = attempt || 0;
        var filePath = 'public/uploads/' + collection + '/' + filename;
        var apiUrl = 'https://api.github.com/repos/yunglordsimens/umprumtype/contents/' + filePath;
        var headers = {
          'Authorization': 'Bearer ' + token,
          'Content-Type': 'application/json',
        };
        return fetch(apiUrl, { headers: headers })
          .then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; })
          .then(function (existing) {
            var body = { message: 'upload ' + filename, content: b64, branch: 'main' };
            if (existing && existing.sha) body.sha = existing.sha;
            return fetch(apiUrl, { method: 'PUT', headers: headers, body: JSON.stringify(body) });
          })
          .then(function (res) {
            if (res.status === 409 && attempt < 4) {
              return delay(800 * (attempt + 1)).then(function () {
                return uploadFile(b64, filename, collection, token, attempt + 1);
              });
            }
            if (!res.ok) throw new Error('GitHub API error ' + res.status);
            return '/uploads/' + collection + '/' + filename;
          });
      }

      var GalleryControl = createClass({
        displayName: 'GalleryControl',

        getInitialState: function () {
          return {
            images: toArray(this.props.value),
            busy: false,
            progress: '',
            error: null,
            dragOver: false,
          };
        },

        componentDidUpdate: function (prevProps, prevState) {
          if (prevState.images !== this.state.images) {
            this.props.onChange(this.state.images);
          }
        },

        processFiles: function (files) {
          var self = this;
          var imgs = [];
          for (var i = 0; i < files.length; i++) {
            if (files[i].type && files[i].type.indexOf('image/') === 0) imgs.push(files[i]);
          }
          if (!imgs.length) return;
          var token = getToken();
          if (!token) { self.setState({ error: 'Not authenticated.' }); return; }
          var collection = getCollection();
          self.setState({ busy: true, error: null });
          var results = [];
          var chain = Promise.resolve();
          imgs.forEach(function (file, i) {
            chain = chain.then(function () {
              self.setState({ progress: (i + 1) + ' / ' + imgs.length });
              var pause = i === 0 ? Promise.resolve() : delay(600);
              return pause.then(function () { return compressImage(file); })
                .then(function (compressed) {
                  var ext = compressed.isPng ? 'png' : 'jpg';
                  var name = Date.now() + '-' + Math.random().toString(36).slice(2, 7) + '.' + ext;
                  return uploadFile(compressed.b64, name, collection, token);
                })
                .then(function (path) { results.push(path); })
                .catch(function (e) { self.setState({ error: e.message }); });
            });
          });
          chain.then(function () {
            self.setState(function (s) {
              return { images: s.images.concat(results), busy: false, progress: '' };
            });
          });
        },

        onDrop: function (e) {
          e.preventDefault();
          this.setState({ dragOver: false });
          this.processFiles(e.dataTransfer.files);
        },
        onDragOver: function (e) { e.preventDefault(); this.setState({ dragOver: true }); },
        onDragLeave: function () { this.setState({ dragOver: false }); },
        onFileChange: function (e) { this.processFiles(e.target.files); e.target.value = ''; },

        removeImage: function (idx) {
          this.setState(function (s) {
            return { images: s.images.filter(function (_, i) { return i !== idx; }) };
          });
        },

        onThumbDragStart: function (e, idx) {
          this._dragIdx = idx;
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', String(idx));
        },
        onThumbDragEnter: function (e, idx) {
          e.preventDefault();
          var from = this._dragIdx;
          if (from == null || from === idx) return;
          this.setState(function (s) {
            var arr = s.images.slice();
            var moved = arr.splice(from, 1)[0];
            arr.splice(idx, 0, moved);
            return { images: arr };
          });
          this._dragIdx = idx;
        },
        onThumbDragOver: function (e) { e.preventDefault(); },
        onThumbDragEnd: function () { this._dragIdx = null; },

        render: function () {
          var self = this;
          var s = this.state;
          var children = [];

          children.push(h('div', {
            key: 'drop',
            className: 'gw__drop' + (s.dragOver ? ' gw__drop--over' : ''),
            onDrop: function (e) { self.onDrop(e); },
            onDragOver: function (e) { self.onDragOver(e); },
            onDragLeave: function () { self.onDragLeave(); },
            onClick: function () { if (!s.busy && self._fileInput) self._fileInput.click(); },
            role: 'button',
            tabIndex: 0,
            onKeyDown: function (e) { if (e.key === 'Enter' && self._fileInput) self._fileInput.click(); },
          },
            h('input', {
              ref: function (el) { self._fileInput = el; },
              type: 'file',
              multiple: true,
              accept: 'image/*',
              style: { display: 'none' },
              onChange: function (e) { self.onFileChange(e); },
            }),
            s.busy ? ('Uploading ' + s.progress + '...') : '+ Add photos — click or drop several at once'
          ));

          if (s.error) {
            children.push(h('p', { key: 'err', className: 'gw__error' }, s.error));
          }

          if (s.images.length > 0) {
            children.push(h('p', { key: 'count', className: 'gw__count' },
              s.images.length + ' photo' + (s.images.length !== 1 ? 's' : '') + ' - drag to reorder'
            ));
            children.push(h('div', { key: 'grid', className: 'gw__grid' },
              s.images.map(function (src, idx) {
                return h('div', {
                  key: String(idx),
                  className: 'gw__thumb',
                  draggable: true,
                  onDragStart: function (e) { self.onThumbDragStart(e, idx); },
                  onDragEnter: function (e) { self.onThumbDragEnter(e, idx); },
                  onDragOver: function (e) { self.onThumbDragOver(e); },
                  onDragEnd: function () { self.onThumbDragEnd(); },
                },
                  h('img', { src: src, alt: '' }),
                  h('button', {
                    type: 'button',
                    className: 'gw__remove',
                    onClick: function (e) { e.stopPropagation(); self.removeImage(idx); },
                  }, 'x')
                );
              })
            ));
          }

          return h('div', null, children);
        },
      });

      var GalleryPreview = createClass({
        displayName: 'GalleryPreview',
        render: function () {
          var imgs = toArray(this.props.value);
          if (!imgs.length) return null;
          return h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: '6px' } },
            imgs.map(function (src, i) {
              return h('img', {
                key: String(i), src: src, alt: '',
                style: { height: '72px', width: 'auto', objectFit: 'cover' },
              });
            })
          );
        },
      });

      // ── UMPRUM additions ──────────────────────────────────────────────
      // 1) logo goes back to the collections; 2) labels marked required /
      // optional; 3) grid cards get a typeface specimen or the first photo
      var cards = null;
      fetch('/admin/cards.json').then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) { cards = d; decorate(); }).catch(function () {});
      var loadedFaces = {};
      function faceFor(slug, c) {
        var fam = 'u-card-' + slug;
        if (!loadedFaces[fam]) {
          loadedFaces[fam] = true;
          try {
            var f = new FontFace(fam, 'url(' + c.font + ')', { weight: String(c.weight || 400), style: c.style || 'normal' });
            f.load().then(function (ff) { document.fonts.add(ff); }).catch(function () {});
          } catch (_) {}
        }
        return '"' + fam + '", var(--u-font)';
      }
      function decorate() {
        var logo = document.querySelector('[class*="-AppHeaderLogo"]');
        if (logo && !logo.dataset.u) {
          logo.dataset.u = '1';
          logo.style.cursor = 'pointer';
          logo.addEventListener('click', function () { location.hash = '#/'; });
        }
        document.querySelectorAll('[class*="-FieldLabel"]:not([data-u])').forEach(function (l) {
          l.dataset.u = '1';
          if (l.closest('[class*="-ListControl"], [class*="-ObjectControl"]') &&
              l.closest('[class*="-ListControl"], [class*="-ObjectControl"]') !== l.closest('[class*="-ControlContainer"]')) return;
          l.classList.add(/\(optional\)\s*$/i.test(l.textContent) ? 'u-opt' : 'u-req');
        });
        if (!cards) return;
        document.querySelectorAll('a[href*="/collections/"][href*="/entries/"]').forEach(function (a) {
          if (a.dataset.u || !/GridCard/.test(a.className + ' ' + (a.parentElement && a.parentElement.className))) return;
          var m = a.getAttribute('href').match(/collections\/([^/]+)\/entries\/([^/?#]+)/);
          if (!m) return;
          a.dataset.u = '1';
          var col = m[1], slug = decodeURIComponent(m[2]);
          if (a.querySelector('[class*="-CardImage"]')) return;
          var media = document.createElement('div');
          media.className = 'u-card-media';
          var c = (cards[col] || {})[slug];
          if (col === 'typefaces') {
            media.classList.add('u-card-type');
            if (c) { media.style.setProperty('--card-font', faceFor(slug, c)); media.style.fontWeight = c.weight || 400; media.style.fontStyle = c.style || 'normal'; }
            var aa = document.createElement('span'); aa.className = 'u-card-aa'; aa.textContent = 'Aa';
            var line = document.createElement('span'); line.className = 'u-card-line'; line.textContent = c ? c.text : 'New — publish to see it here';
            media.appendChild(aa); media.appendChild(line);
          } else if (c) {
            media.style.backgroundImage = 'url("' + c + '")';
          } else {
            media.classList.add('u-card-empty');
            media.textContent = 'No photo yet';
          }
          a.insertBefore(media, a.firstChild);
        });
      }
      new MutationObserver(function () { decorate(); }).observe(document.documentElement, { childList: true, subtree: true });

      // Typeface preview pane: looks like the row on /typefaces
      var TypefacePreview = createClass({
        displayName: 'TypefacePreview',
        render: function () {
          var self = this;
          var data = this.props.entry.get('data');
          var get = function (k) { var v = data && data.get ? data.get(k) : null; return v == null ? '' : v; };
          var faces = toArray(get('fonts')).map(function (f, i) {
            var url = '';
            try { if (f && f.file) url = String(self.props.getAsset(f.file)); } catch (_) {}
            return { i: i, url: url, w: f && f.weight || 400, st: f && f.style || 'normal', name: f && f.variant || 'Regular' };
          }).filter(function (f) { return f.url; });
          var css = faces.map(function (f) {
            return '@font-face{font-family:"tf' + f.i + '";src:url("' + f.url + '");font-weight:' + f.w + ';font-style:' + f.st + ';}';
          }).join('');
          var fam = function (f) { return f ? '"tf' + f.i + '", var(--ui)' : 'var(--ui)'; };
          var preview = get('mainText') || get('name') || 'Preview line';
          var tester = get('testerText') || preview;
          var tags = toArray(get('tags'));
          return h('div', { className: 'tfp' },
            h('style', null, css),
            h('div', { className: 'tfp-meta' },
              h('span', null, get('name') || '1. Name'),
              h('span', null, get('designer') || '2. Designer'),
              h('span', null, String(get('year') || '3. Year'))),
            h('div', { className: 'tfp-line', style: { fontFamily: fam(faces[0]), fontWeight: faces[0] ? faces[0].w : 400, fontStyle: faces[0] ? faces[0].st : 'normal' } }, preview),
            faces.length
              ? faces.map(function (f) {
                  return h('div', { key: f.i, className: 'tfp-style' },
                    h('div', { className: 'tfp-label' }, f.name),
                    h('div', { className: 'tfp-tester', style: { fontFamily: fam(f), fontWeight: f.w, fontStyle: f.st } }, tester));
                })
              : h('p', { className: 'tfp-empty' }, 'Add font files (field 6) to see the typeface here.'),
            (tags.length || get('description')) ? h('div', { className: 'tfp-info' },
              tags.length ? h('div', { className: 'tfp-tags' }, tags.map(function (t, i) { return h('span', { key: i }, t); })) : null,
              get('description') ? h('p', null, get('description')) : null) : null
          );
        },
      });
      window.CMS.registerPreviewTemplate('typefaces', TypefacePreview);

      window.CMS.registerWidget('gallery-upload', GalleryControl, GalleryPreview);
      // Preview pane uses the site's font and colours
      window.CMS.registerPreviewStyle('/admin/preview.css');

    } catch (err) {
      console.error('[gw] registration failed:', err.message, err.stack);
    }
  </script>
</body>
