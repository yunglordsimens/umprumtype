backend:
  name: github
  repo: yunglordsimens/umprumtype
  branch: main
  base_url: https://typoumprum.cz
  auth_endpoint: api/auth

# UMPRUM Type wordmark (Svar outlines) on the login screen and in the header
logo:
  src: /admin/logo.svg
  show_in_header: true
site_url: https://typoumprum.cz
display_url: https://typoumprum.cz

media_folder: "public/uploads"
public_folder: "/uploads"

slug:
  encoding: "ascii"
  clean_accents: true

# ---------------------------------------------------------------------------
# TYPEFACES
# One entry = one typeface on /typefaces. Entry: src/content/typefaces/{name}.md,
# fonts: public/fonts/{name}/. Older typefaces also read public/fonts/*/info.txt;
# anything filled in here wins over info.txt.
# ---------------------------------------------------------------------------
collections:

  - name: "typefaces"
    label: "Typefaces"
    label_singular: "Typeface"
    description: |-
      How to add a typeface:
      1. Name — type it first. The page address and the font folder are made from it.
      2–3. Designer and Year.
      4–5. Preview line (one short sentence) and Tester text (the long text).
      6. Font files — one row per style: Regular, Bold, Italic…
      Then Publish (top right). The site updates in about a minute. Fields 7–13 are optional.
    folder: "src/content/typefaces"
    create: true
    delete: true
    identifier_field: "name"
    slug: "{{slug}}"
    extension: "md"
    media_folder: "/public/fonts/{{slug}}"
    public_folder: "/fonts/{{slug}}"
    summary: "{{name}} — {{designer}}, {{year}}"
    sortable_fields: ["name", "designer", "year"]
    fields:
      # — Required: steps 1–3 —
      - label: "1. Name"
        name: "name"
        widget: "string"
        hint: "Type this FIRST, before uploading fonts — the page address and the font folder are made from it. Example: Cutscene"
      - label: "2. Designer"
        name: "designer"
        widget: "string"
        hint: "Full name. Several people: Name Surname, Name Surname"
      - label: "3. Year"
        name: "year"
        widget: "number"
        value_type: "int"
        min: 2000
        max: 2100

      # — The texts set in the font —
      - label: "4. Preview line"
        name: "mainText"
        widget: "string"
        required: false
        hint: "ONE SHORT LINE (5–10 words) shown huge in the list, scrolling sideways. Example: Born 2 be mysterious, forced to have LinkedIn. Use only characters the font has."
      - label: "5. Tester text"
        name: "testerText"
        widget: "text"
        required: false
        hint: "The LONGER text (a paragraph or more) shown in every style when the typeface is opened. Leave empty to repeat the Preview line."

      # — Font files —
      - label: "6. Font files (.woff2)"
        label_singular: "font file"
        name: "fonts"
        widget: "list"
        summary: "{{fields.variant}} · {{fields.weight}} {{fields.style}}"
        required: false
        hint: "One entry per style, in the order they should appear. Only .woff2 files."
        fields:
          - label: "File"
            name: "file"
            widget: "file"
            hint: "Upload the .woff2 for this style."
            media_library:
              config:
                multiple: false
          - label: "Style name"
            name: "variant"
            widget: "string"
            default: "Regular"
            hint: "Shown above the tester: Regular, Bold, Italic, Light Italic…"
          - label: "Weight"
            name: "weight"
            widget: "number"
            default: 400
            hint: "100 Thin · 300 Light · 400 Regular · 700 Bold · 900 Black"
          - label: "Style"
            name: "style"
            widget: "select"
            options: ["normal", "italic"]
            default: "normal"
            hint: "italic for italic styles, otherwise normal."

      # — Optional extras —
      - label: "7. Tags"
        name: "tags"
        widget: "list"
        required: false
        default: []
        hint: "Comma separated, lowercase: serif, display, text…"
      - label: "8. About the typeface"
        name: "description"
        widget: "text"
        required: false
        hint: "A paragraph about the typeface. Shown when the typeface is opened."
      - label: "9. Preview size"
        name: "mainSize"
        widget: "string"
        default: "6em"
        required: false
        hint: "Size of the Preview line. 4em text faces · 6em display (default) · 8em large · 10em poster."
      - label: "10. Tester size"
        name: "testerSize"
        widget: "string"
        default: "4em"
        required: false
        hint: "Starting size of the Tester text. 2em–3em for text faces, 4em display (default)."
      - label: "11. Designer website"
        name: "authorUrl"
        widget: "string"
        required: false
        hint: "Full address (https://…)."
      - label: "12. Designer email"
        name: "authorEmail"
        widget: "string"
        required: false
      - label: "13. Instagram"
        name: "authorInstagram"
        widget: "string"
        required: false
        hint: "@handle — saved, but not shown on the site yet."

      - label: "Internal notes"
        name: "body"
        widget: "markdown"
        required: false
        hint: "Only for the team — never shown on the site."

  # -------------------------------------------------------------------------
  # PROJECTS
  # -------------------------------------------------------------------------
  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    description: |-
      How to add a project:
      1–4. Title, Author, Date, Category.
      6. Short description — one or two sentences.
      7. Photos — drop several at once, drag to reorder.
      8. Article text.
      Then Publish (top right). The site updates in about a minute.
    folder: "src/content/projects"
    create: true
    slug: "{{year}}-{{slug}}"
    extension: "md"
    media_folder: "/public/uploads/projects/{{slug}}"
    public_folder: "/uploads/projects/{{slug}}"
    summary: "{{title}} — {{date | date('YYYY')}}"
    sortable_fields: ["title", "date", "author"]
    fields:
      # — Basics: what appears in the list row (Title / Author / Year) —
      - label: "1. Title"
        name: "title"
        widget: "string"
        hint: "Shown in the list and as the heading of the article."
      - label: "2. Author"
        name: "author"
        widget: "string"
        required: false
        hint: "Who made it. Several people: Name Surname, Name Surname"
      - label: "3. Date"
        name: "date"
        widget: "datetime"
        hint: "When it happened. The list shows only the year."
      - label: "4. Category"
        name: "category"
        widget: "select"
        options: ["exhibition", "workshop", "publication", "collaboration", "lecture"]
        hint: "Pick one."
      - label: "5. Tags"
        name: "tags"
        widget: "list"
        required: false
        default: []
        hint: "Comma separated, lowercase: zine, print… Visitors filter the list by them."

      # — Content —
      - label: "6. Short description"
        name: "excerpt"
        widget: "text"
        required: false
        hint: "One or two sentences. Shown at the top of the article."
      - label: "7. Photos"
        name: "gallery"
        widget: "gallery-upload"
        required: false
        default: []
        hint: "Drop several photos at once, drag to reorder. The first ones appear in the list; in the article they sit between the paragraphs."
      - label: "8. Article text"
        name: "body"
        widget: "markdown"
        required: false
        hint: "The text of the article. Leave an empty line between paragraphs."
      - label: "9. Website"
        name: "siteUrl"
        widget: "string"
        required: false
        hint: "Optional link, full address: https://…"

      # — Store —
      - label: "10. Sell in Store"
        name: "purchasable"
        widget: "boolean"
        default: false
        hint: "Turn on to show it in the Store."
      - label: "11. Store cover image"
        name: "storeImage"
        widget: "image"
        required: false
        hint: "Picture for the Store. Without it the first photo is used."
      - label: "12. Contact"
        name: "contact"
        widget: "text"
        required: false
        hint: "Email or other contact, shown at the end of the article and in the Store."

      # Not used on the site yet — kept in the files, hidden from the form
      - label: "Featured"
        name: "featured"
        widget: "hidden"
        default: false

  # -------------------------------------------------------------------------
  # JOURNAL
  # -------------------------------------------------------------------------
  - name: "journal"
    label: "Journal"
    label_singular: "Entry"
    description: |-
      How to add a journal entry:
      1–4. Title, Author, Date, Category.
      6. Short description — one or two sentences.
      7. Photos — drop several at once, drag to reorder.
      8. Article text.
      Then Publish (top right). The site updates in about a minute.
    folder: "src/content/journal"
    create: true
    slug: "{{year}}-{{slug}}"
    extension: "md"
    media_folder: "/public/uploads/journal/{{slug}}"
    public_folder: "/uploads/journal/{{slug}}"
    summary: "{{title}} — {{date | date('YYYY')}}"
    sortable_fields: ["title", "date", "author"]
    fields:
      # — Basics: what appears in the list row (Title / Author / Year) —
      - label: "1. Title"
        name: "title"
        widget: "string"
        hint: "Shown in the list and as the heading of the article."
      - label: "2. Author"
        name: "author"
        widget: "string"
        required: false
        hint: "Who made it. Several people: Name Surname, Name Surname"
      - label: "3. Date"
        name: "date"
        widget: "datetime"
        hint: "When it happened. The list shows only the year."
      - label: "4. Category"
        name: "category"
        widget: "select"
        options: ["essay", "interview", "process", "review", "news"]
        hint: "Pick one."
      - label: "5. Tags"
        name: "tags"
        widget: "list"
        required: false
        default: []
        hint: "Comma separated, lowercase: zine, print… Visitors filter the list by them."

      # — Content —
      - label: "6. Short description"
        name: "excerpt"
        widget: "text"
        required: false
        hint: "One or two sentences. Shown at the top of the article."
      - label: "7. Photos"
        name: "gallery"
        widget: "gallery-upload"
        required: false
        default: []
        hint: "Drop several photos at once, drag to reorder. The first ones appear in the list; in the article they sit between the paragraphs."
      - label: "8. Article text"
        name: "body"
        widget: "markdown"
        required: false
        hint: "The text of the article. Leave an empty line between paragraphs."
      - label: "9. Website"
        name: "siteUrl"
        widget: "string"
        required: false
        hint: "Optional link, full address: https://…"

      # — Store —
      - label: "10. Sell in Store"
        name: "purchasable"
        widget: "boolean"
        default: false
        hint: "Turn on to show it in the Store."
      - label: "11. Store cover image"
        name: "storeImage"
        widget: "image"
        required: false
        hint: "Picture for the Store. Without it the first photo is used."
      - label: "12. Contact"
        name: "contact"
        widget: "text"
        required: false
        hint: "Email or other contact for buying. Shown only when Sell in Store is on."

      # Not used on the site yet — kept in the files, hidden from the form
      - label: "Featured"
        name: "featured"
        widget: "hidden"
        default: false
