backend:
  name: github
  repo: yunglordsimens/umprumtype
  branch: main
  base_url: https://decap-cms-oauth-gamma.vercel.app
  auth_endpoint: api/auth

media_folder: "public/uploads"
public_folder: "/uploads"

slug:
  encoding: "ascii"
  clean_accents: true

# ---------------------------------------------------------------------------
# TYPEFACES
# Each entry becomes src/content/typefaces/{slug}.md.
# The site builds typeface pages directly from public/fonts/*/info.txt,
# so this CMS is for manual metadata overrides and editorial control only.
# OTF files stay in public/fonts/ — never upload fonts here.
# ---------------------------------------------------------------------------
collections:

  - name: "typefaces"
    label: "Typefaces"
    label_singular: "Typeface"
    folder: "src/content/typefaces"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    media_folder: "/public/fonts/{{slug}}"
    public_folder: "/fonts/{{slug}}"
    summary: "{{name}} — {{designer}}, {{year}}"
    sortable_fields: ["name", "designer", "year"]
    fields:
      - label: "Name"
        name: "name"
        widget: "string"
        hint: "Display name of the typeface."

      - label: "Designer"
        name: "designer"
        widget: "string"

      - label: "Year"
        name: "year"
        widget: "number"
        value_type: "int"
        min: 2000
        max: 2100

      - label: "Font files (.woff2)"
        name: "fonts"
        widget: "list"
        required: false
        hint: "Upload each .woff2 variant. Files go to public/fonts/{slug}/."
        fields:
          - label: "File"
            name: "file"
            widget: "file"
            hint: "Upload .woff2 file"
            media_library:
              config:
                multiple: false
          - label: "Variant name"
            name: "variant"
            widget: "string"
            default: "Regular"
            hint: "e.g. Regular, Bold, Light Italic"
          - label: "Weight"
            name: "weight"
            widget: "number"
            default: 400
            hint: "100 = Thin, 300 = Light, 400 = Regular, 700 = Bold, 900 = Black"
          - label: "Style"
            name: "style"
            widget: "select"
            options: ["normal", "italic"]
            default: "normal"

      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        default: []
        hint: "e.g. serif, display, experimental, text"

      - label: "Description"
        name: "description"
        widget: "text"
        required: false
        hint: "About the typeface — shown on the specimen page."

      - label: "Specimen headline"
        name: "mainText"
        widget: "string"
        required: false
        hint: "Text shown in the collapsed preview row AND as the starting text in the expanded specimen (editable by visitor). If empty, falls back to the typeface name."

      - label: "Preview size"
        name: "mainSize"
        widget: "string"
        default: "6em"
        required: false
        hint: "Controls font size in the collapsed typeface row. Recommended: 3em (small/dense text fonts), 4em (text fonts), 5em (default), 6em (display), 8em (very large display), 10em (headline/poster). Use larger values for fonts with small x-height or thin strokes."

      - label: "Designer URL"
        name: "authorUrl"
        widget: "string"
        required: false
        hint: "Full URL (https://...)"

      - label: "Instagram"
        name: "authorInstagram"
        widget: "string"
        required: false
        hint: "@handle"

      - label: "Email"
        name: "authorEmail"
        widget: "string"
        required: false

      - label: "Featured on homepage"
        name: "featured"
        widget: "boolean"
        default: false
        hint: "Featured typefaces appear first in the homepage grid."

      - label: "Notes (internal)"
        name: "body"
        widget: "markdown"
        required: false
        hint: "Internal notes. Not shown on the public site."

  # -------------------------------------------------------------------------
  # PROJECTS
  # -------------------------------------------------------------------------
  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    folder: "src/content/projects"
    create: true
    slug: "{{year}}-{{slug}}"
    extension: "md"
    media_folder: "/public/uploads/projects/{{slug}}"
    public_folder: "/uploads/projects/{{slug}}"
    fields:
      - { label: "Title",  name: "title",  widget: "string" }
      - { label: "Author", name: "author", widget: "string", required: false }
      - { label: "Date",   name: "date",   widget: "datetime" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["exhibition", "workshop", "publication", "collaboration", "lecture"]
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - label: "Photos"
        name: "gallery"
        widget: "gallery-upload"
        required: false
        default: []
        hint: "Upload photos — drag to reorder."
      - { label: "Text", name: "body", widget: "markdown", required: false }
      - { label: "Excerpt",    name: "excerpt",    widget: "text",    required: false }
      - { label: "Featured",   name: "featured",   widget: "boolean", default: false }
      - { label: "Purchasable", name: "purchasable", widget: "boolean", default: false }
      - { label: "Store Image (optional)", name: "storeImage", widget: "image", required: false, hint: "Cover image for the Store card." }
      - { label: "Contact info", name: "contact", widget: "text", required: false }
      - label: "Website URL"
        name: "siteUrl"
        widget: "string"
        required: false
        hint: "Full URL (https://...). Shows a click-to-activate iframe preview + link in the detail panel."

  # -------------------------------------------------------------------------
  # JOURNAL
  # -------------------------------------------------------------------------
  - name: "journal"
    label: "Journal"
    label_singular: "Entry"
    folder: "src/content/journal"
    create: true
    slug: "{{year}}-{{slug}}"
    extension: "md"
    media_folder: "/public/uploads/journal/{{slug}}"
    public_folder: "/uploads/journal/{{slug}}"
    fields:
      - { label: "Title",   name: "title",   widget: "string" }
      - { label: "Author",  name: "author",  widget: "string",   required: false }
      - { label: "Date",    name: "date",    widget: "datetime" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["essay", "interview", "process", "review", "news"]
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - label: "Photos"
        name: "gallery"
        widget: "gallery-upload"
        required: false
        default: []
        hint: "Upload photos — drag to reorder."
      - { label: "Text", name: "body", widget: "markdown", required: false }
      - { label: "Excerpt",    name: "excerpt",    widget: "text",    required: false }
      - { label: "Featured",   name: "featured",   widget: "boolean", default: false }
      - { label: "Purchasable", name: "purchasable", widget: "boolean", default: false }
      - { label: "Store Image (optional)", name: "storeImage", widget: "image", required: false, hint: "Cover image for the Store card." }
      - { label: "Contact info", name: "contact", widget: "text", required: false }
      - label: "Website URL"
        name: "siteUrl"
        widget: "string"
        required: false
        hint: "Full URL (https://...). Shows a click-to-activate iframe preview + link in the detail panel."
