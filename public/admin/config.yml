backend:
  name: github
  repo: yunglordsimens/umprumtype
  branch: main
  base_url: https://typoumprum.cz
  auth_endpoint: api/auth

# UMPRUM Type wordmark (Svar outlines) on the login screen and in the header
logo:
  src: /admin/logo.svg
  show_in_header: true
site_url: https://typoumprum.cz
display_url: https://typoumprum.cz

media_folder: "public/uploads"
public_folder: "/uploads"

slug:
  encoding: "ascii"
  clean_accents: true

# ---------------------------------------------------------------------------
# TYPEFACES
# One entry = one typeface on /typefaces. Entry: src/content/typefaces/{name}.md,
# fonts: public/fonts/{name}/. Older typefaces also read public/fonts/*/info.txt;
# anything filled in here wins over info.txt.
# ---------------------------------------------------------------------------
collections:

  - name: "typefaces"
    label: "Typefaces"
    label_singular: "Typeface"
    description: "How to add a typeface: 1) type the Name first, 2) fill in Designer and Year, 3) add a Preview line and a Tester text, 4) at the bottom add one Font file per style (Regular, Bold, Italic…), 5) Publish. The site rebuilds in about a minute."
    folder: "src/content/typefaces"
    create: true
    delete: true
    identifier_field: "name"
    slug: "{{slug}}"
    extension: "md"
    media_folder: "/public/fonts/{{slug}}"
    public_folder: "/fonts/{{slug}}"
    summary: "{{name}} — {{designer}}, {{year}}"
    sortable_fields: ["name", "designer", "year"]
    fields:
      # — Basics: the row above the preview (Name / Designer / Year) —
      - label: "Name"
        name: "name"
        widget: "string"
        hint: "Fill this in FIRST, before uploading fonts. The page address and the font folder are made from it. Example: Cutscene"
      - label: "Designer"
        name: "designer"
        widget: "string"
        hint: "Full name. Several people: Name Surname, Name Surname"
      - label: "Year"
        name: "year"
        widget: "number"
        value_type: "int"
        min: 2000
        max: 2100
      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        default: []
        hint: "Comma separated, lowercase: serif, display, text…"
      - label: "About the typeface"
        name: "description"
        widget: "text"
        required: false
        hint: "A paragraph about the typeface. Shown when the typeface is opened."

      # — The two texts set in the font —
      - label: "Preview line"
        name: "mainText"
        widget: "string"
        required: false
        hint: "ONE SHORT LINE (5–10 words) shown huge in the list, scrolling sideways. Example: Born 2 be mysterious, forced to have LinkedIn. Use only characters the font has."
      - label: "Tester text"
        name: "testerText"
        widget: "text"
        required: false
        hint: "The LONGER text (a paragraph or more) shown in every style when the typeface is opened. Leave empty to repeat the Preview line."

      # — Sizes (can stay as they are) —
      - label: "Preview size"
        name: "mainSize"
        widget: "string"
        default: "6em"
        required: false
        hint: "Size of the Preview line. 4em text faces · 6em display (default) · 8em large · 10em poster."
      - label: "Tester size"
        name: "testerSize"
        widget: "string"
        default: "4em"
        required: false
        hint: "Starting size of the Tester text. 2em–3em for text faces, 4em display (default)."

      # — Designer contact (shown under the description) —
      - label: "Designer website"
        name: "authorUrl"
        widget: "string"
        required: false
        hint: "Full address (https://…)."
      - label: "Designer email"
        name: "authorEmail"
        widget: "string"
        required: false
      - label: "Instagram"
        name: "authorInstagram"
        widget: "string"
        required: false
        hint: "@handle — saved, but not shown on the site yet."

      # — Files —
      - label: "Font files (.woff2)"
        name: "fonts"
        widget: "list"
        required: false
        hint: "One entry per style, in the order they should appear. Only .woff2 files."
        fields:
          - label: "File"
            name: "file"
            widget: "file"
            hint: "Upload the .woff2 for this style."
            media_library:
              config:
                multiple: false
          - label: "Style name"
            name: "variant"
            widget: "string"
            default: "Regular"
            hint: "Shown above the tester: Regular, Bold, Italic, Light Italic…"
          - label: "Weight"
            name: "weight"
            widget: "number"
            default: 400
            hint: "100 Thin · 300 Light · 400 Regular · 700 Bold · 900 Black"
          - label: "Style"
            name: "style"
            widget: "select"
            options: ["normal", "italic"]
            default: "normal"
            hint: "italic for italic styles, otherwise normal."

      - label: "Internal notes"
        name: "body"
        widget: "markdown"
        required: false
        hint: "Only for the team — never shown on the site."

  # -------------------------------------------------------------------------
  # PROJECTS
  # -------------------------------------------------------------------------
  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    folder: "src/content/projects"
    create: true
    slug: "{{year}}-{{slug}}"
    extension: "md"
    media_folder: "/public/uploads/projects/{{slug}}"
    public_folder: "/uploads/projects/{{slug}}"
    summary: "{{title}} — {{date | date('YYYY')}}"
    sortable_fields: ["title", "date", "author"]
    fields:
      # — Basics: what appears in the list row (Title / Author / Year) —
      - label: "Title"
        name: "title"
        widget: "string"
        hint: "Shown in the list and as the heading of the opened article."
      - label: "Author"
        name: "author"
        widget: "string"
        required: false
        hint: "Shown next to the title in the list."
      - label: "Date"
        name: "date"
        widget: "datetime"
        hint: "The list shows the year; the opened article shows the full date."
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["exhibition", "workshop", "publication", "collaboration", "lecture"]
        hint: "Shown at the top of the opened article."
      - label: "Tags"
        name: "tags"
        widget: "list"
        default: []
        hint: "Separate with commas, e.g. zine, print. Visitors can filter the list by tags."

      # — Content —
      - label: "Short description"
        name: "excerpt"
        widget: "text"
        required: false
        hint: "One or two sentences. Opens the article in a lighter colour and is included in search."
      - label: "Photos"
        name: "gallery"
        widget: "gallery-upload"
        required: false
        default: []
        hint: "Drag to reorder. The first 8 form the image strip in the list; in the article all photos are placed between the paragraphs of the text."
      - label: "Article text"
        name: "body"
        widget: "markdown"
        required: false
        hint: "Each paragraph is a separate block — photos are spread between paragraphs."
      - label: "Website"
        name: "siteUrl"
        widget: "string"
        required: false
        hint: "Full address (https://…). Adds a click-to-open preview of the site and a link at the end of the article."

      # — Store —
      - label: "Sell in Store"
        name: "purchasable"
        widget: "boolean"
        default: false
        hint: "Turn on to list this in the Store."
      - label: "Store cover image"
        name: "storeImage"
        widget: "image"
        required: false
        hint: "Optional. Without it the Store card uses the first photo."
      - label: "Contact"
        name: "contact"
        widget: "text"
        required: false
        hint: "Email or other contact. Shown in a Contact box at the end of the article (and in the Store)."

      # — Not shown on the site at the moment —
      - label: "Featured"
        name: "featured"
        widget: "boolean"
        default: false
        hint: "Saved, but not used anywhere on the site yet."

  # -------------------------------------------------------------------------
  # JOURNAL
  # -------------------------------------------------------------------------
  - name: "journal"
    label: "Journal"
    label_singular: "Entry"
    folder: "src/content/journal"
    create: true
    slug: "{{year}}-{{slug}}"
    extension: "md"
    media_folder: "/public/uploads/journal/{{slug}}"
    public_folder: "/uploads/journal/{{slug}}"
    summary: "{{title}} — {{date | date('YYYY')}}"
    sortable_fields: ["title", "date", "author"]
    fields:
      # — Basics: what appears in the list row (Title / Author / Year) —
      - label: "Title"
        name: "title"
        widget: "string"
        hint: "Shown in the list and as the heading of the opened article."
      - label: "Author"
        name: "author"
        widget: "string"
        required: false
        hint: "Shown next to the title in the list."
      - label: "Date"
        name: "date"
        widget: "datetime"
        hint: "The list shows the year; the opened article shows the full date."
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["essay", "interview", "process", "review", "news"]
        hint: "Shown at the top of the opened article."
      - label: "Tags"
        name: "tags"
        widget: "list"
        default: []
        hint: "Separate with commas, e.g. zine, print. Visitors can filter the list by tags."

      # — Content —
      - label: "Short description"
        name: "excerpt"
        widget: "text"
        required: false
        hint: "One or two sentences. Opens the article in a lighter colour and is included in search."
      - label: "Photos"
        name: "gallery"
        widget: "gallery-upload"
        required: false
        default: []
        hint: "Drag to reorder. The first 8 form the image strip in the list; in the article all photos are placed between the paragraphs of the text."
      - label: "Article text"
        name: "body"
        widget: "markdown"
        required: false
        hint: "Each paragraph is a separate block — photos are spread between paragraphs."
      - label: "Website"
        name: "siteUrl"
        widget: "string"
        required: false
        hint: "Full address (https://…). Adds a click-to-open preview of the site and a link at the end of the article."

      # — Store —
      - label: "Sell in Store"
        name: "purchasable"
        widget: "boolean"
        default: false
        hint: "Turn on to list this in the Store."
      - label: "Store cover image"
        name: "storeImage"
        widget: "image"
        required: false
        hint: "Optional. Without it the Store card uses the first photo."
      - label: "Contact"
        name: "contact"
        widget: "text"
        required: false
        hint: "Email or other contact for buying. In the Journal it is shown only when Sell in Store is on."

      # — Not shown on the site at the moment —
      - label: "Featured"
        name: "featured"
        widget: "boolean"
        default: false
        hint: "Saved, but not used anywhere on the site yet."
