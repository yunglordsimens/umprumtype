name: Optimize uploaded images

on:
  push:
    branches: [main]
    paths:
      - 'public/uploads/**'

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Sharp
        run: npm install --no-save sharp

      - name: Run optimizer
        run: node scripts/optimize-images.mjs

      - name: Commit compressed images
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/uploads/
          git diff --cached --quiet || git commit -m "chore: compress uploaded images [skip ci]"
          git push
