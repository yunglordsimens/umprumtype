<!-- ==================== UMPRUM TYPE - GLOBAL HEADER ==================== -->

<div class="headerMenuWrapper">
    <div class="homeItem">
        <a href="/index.html">UMPRUM TYPE</a>
    </div>
    <div class="headerMenu">
        <div class="menuItem"><a href="/index.html">Home</a></div>
        <div class="menuItem"><a href="/typefaces.html">Typefaces</a></div>
        <div class="menuItem"><a href="/play/index.html">Playground →</a></div>
        <div class="menuItem"><a href="/info.html">Info</a></div>
        <div class="menuItem"><a href="/projects.html">Projects</a></div>
        <div class="menuItem"><a href="/journal.html">Journal</a></div>
        <div class="menuItem"><a href="/store.html">Store</a></div>
    </div>
    <button id="mobile-menu-toggle" aria-label="Toggle menu">☰</button>
</div>

<script>
// Simple mobile menu toggle (can be moved to shared.js later)
document.addEventListener('DOMContentLoaded', function() {
    const toggle = document.getElementById('mobile-menu-toggle');
    const menu = document.querySelector('.headerMenu');
    
    if (toggle && menu) {
        toggle.addEventListener('click', () => {
            menu.classList.toggle('active');
            // Update button text
            toggle.textContent = menu.classList.contains('active') ? '✕' : '☰';
        });
        
        // Close menu when clicking outside
        document.addEventListener('click', (e) => {
            if (!menu.contains(e.target) && !toggle.contains(e.target) && menu.classList.contains('active')) {
                menu.classList.remove('active');
                toggle.textContent = '☰';
            }
        });
    }
    
    // Highlight active page (simple implementation)
    const currentPath = window.location.pathname;
    const menuItems = document.querySelectorAll('.menuItem a');
    menuItems.forEach(item => {
        if (item.getAttribute('href') === currentPath || 
            (currentPath === '/' && item.getAttribute('href') === '/index.html')) {
            item.classList.add('active');
        }
    });
});
</script>
